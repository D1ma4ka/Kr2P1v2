name: KraPiva P8.4 phone APK
on:
  push:
    branches:
      - codex/krapiva-p8.4-offline
    paths:
      - .github/workflows/p84-phone-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout P8.4 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper checksum
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Set up Android command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble phone debug APK
        working-directory: android
        env:
          KRAPIVA_DEV_API_BASE_URL: http://127.0.0.1:53000/
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Verify and name the downloadable APK
        run: |
          mkdir -p phone-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk phone-apk/KraPiva-P8.4-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs phone-apk/KraPiva-P8.4-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 phone-apk/KraPiva-P8.4-debug.apk
          cd phone-apk
          sha256sum KraPiva-P8.4-debug.apk | tee SHA256SUMS.txt
          git -C .. rev-parse HEAD > source-commit.txt
      - name: Upload APK to the private repository's Actions artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KraPiva-P8.4-phone-debug
          path: phone-apk/
          if-no-files-found: error
          retention-days: 7
