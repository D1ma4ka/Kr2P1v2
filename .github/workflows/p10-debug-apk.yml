name: KraPet Android debug APK
on:
  push:
    branches: [p10/krapet]
    paths:
      - 'android/**'
      - 'assets/pets/**'
      - '.github/workflows/p10-debug-apk.yml'
permissions:
  contents: read
concurrency:
  group: p10-debug-apk
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and verify JVM and lint checks
        working-directory: android
        env:
          KRAPIVA_DEV_API_BASE_URL: http://127.0.0.1:53000/
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify APK and record source
        run: |
          mkdir -p p10-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk p10-artifact/KraPiva-P10-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify p10-artifact/KraPiva-P10-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 p10-artifact/KraPiva-P10-debug.apk
          (cd p10-artifact && sha256sum KraPiva-P10-debug.apk > SHA256SUMS.txt)
          git rev-parse HEAD > p10-artifact/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KraPiva-P10-debug
          path: p10-artifact/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: KraPiva-P10-debug
          path: p10-downloaded
      - name: Verify the downloaded APK
        run: |
          cd p10-downloaded
          test "$(cat source-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs KraPiva-P10-debug.apk > signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 KraPiva-P10-debug.apk
          echo "zipalign: verified" >> signature.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KraPiva-P10-APK-verification
          path: |
            p10-downloaded/source-commit.txt
            p10-downloaded/SHA256SUMS.txt
            p10-downloaded/signature.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify all starter rig and wardrobe combinations
        run: node --test tools/p10/rig.test.mjs
      - name: Start local P10 acceptance services
        run: |
          python3 scripts/init_dev.py
          chmod 644 infra/postgres/01-runtime-role.sql
          docker compose up -d --wait db mailpit
          mkdir -p work
          cd backend
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --env-file=../.env dist/src/db/migrate.js
          node --env-file=../.env dist/src/operations/pet-content.js ../assets/pets/items/catalog.json
          (umask 077; node --env-file=../.env dist/src/operations/pet-content.js --test-reward > ../work/p10-reward.txt)
          PORT=53000 node --env-file=../.env dist/src/main.js > ../work/p10-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:53000/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Boot compact Android emulator
        timeout-minutes: 7
        run: |
          test -e /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          export ANDROID_AVD_HOME="$PWD/work/p10-avd"
          export ANDROID_EMULATOR_HOME="$PWD/work/p10-emulator"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME"
          echo no | avdmanager create avd --name krapet --package 'system-images;android-35;default;x86_64' --device pixel_2
          krapet_run=()
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            krapet_groups="$(id -G | tr ' ' ','),$(stat -c %g /dev/kvm)"
            krapet_run=(sudo -n -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --groups="$krapet_groups" --no-new-privs)
          fi
          "${krapet_run[@]}" env ANDROID_HOME="$ANDROID_HOME" ANDROID_AVD_HOME="$ANDROID_AVD_HOME" ANDROID_EMULATOR_HOME="$ANDROID_EMULATOR_HOME" \
            "$ANDROID_HOME/emulator/emulator" -avd krapet -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > work/p10-emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              adb shell wm size 320x640
              adb shell wm density 160
              adb shell cmd uimode night no
              python3 scripts/prepare_android_emulator.py
              exit 0
            fi
            sleep 2
          done
          tail -n 60 work/p10-emulator.log
          exit 1
      - name: Run P10 instrumented acceptance against real PostgreSQL
        timeout-minutes: 8
        run: |
          node --env-file=.env tools/p10/device-fixture.mjs work/p10-reward.txt --all-starters
          adb reverse tcp:53000 tcp:53000
          adb install p10-downloaded/KraPiva-P10-debug.apk
          adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb push work/p10-device-fixture.json /data/local/tmp/p10-fixture.json
          for scenario in realRoomCatalogWalletAndPartnerReward systemStatusBarMatchesRoomThemeAcrossRecreation eachApprovedStarterCanBeAdopted renderKraPetFramesOnAndroidCanvas; do
            echo "$scenario"
            adb shell am instrument -w -r -e class "ru.krapiva.app.pets.PetAcceptanceTest#$scenario" ru.krapiva.app.debug.test/androidx.test.runner.AndroidJUnitRunner > "work/p10-$scenario.log"
            grep -E '^Time:|^OK|^Tests run:|^INSTRUMENTATION_RESULT: shortMsg=' "work/p10-$scenario.log"
            grep -Fxq 'OK (1 test)' "work/p10-$scenario.log"
          done
      - name: Retain P10 synthetic device evidence
        if: always()
        run: |
          mkdir -p work/p10-device-evidence
          for scenario in realRoomCatalogWalletAndPartnerReward systemStatusBarMatchesRoomThemeAcrossRecreation eachApprovedStarterCanBeAdopted renderKraPetFramesOnAndroidCanvas; do
            if [ -f "work/p10-$scenario.log" ]; then
              echo "$scenario" >> work/p10-device-evidence/result.txt
              grep -E '^Time:|^OK|^Tests run:|^INSTRUMENTATION_RESULT: shortMsg=' "work/p10-$scenario.log" >> work/p10-device-evidence/result.txt || true
            fi
          done
          adb logcat -d -s KraPetPerf:I '*:S' > work/p10-device-evidence/renderer.txt || true
          adb pull /sdcard/Download/KraPivaP3/. work/p10-device-evidence/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: KraPiva-P10-device-evidence
          path: work/p10-device-evidence/
          retention-days: 7
      - name: Stop isolated acceptance services
        if: always()
        run: |
          adb emu kill || true
          docker compose stop db mailpit
