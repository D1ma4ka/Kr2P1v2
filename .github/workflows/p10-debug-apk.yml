name: KraPet Android debug APK
on:
  push:
    branches: [p10/krapet]
    paths:
      - 'android/**'
      - 'assets/pets/**'
      - '.github/workflows/p10-debug-apk.yml'
permissions:
  contents: read
concurrency:
  group: p10-debug-apk
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and verify JVM and lint checks
        working-directory: android
        env:
          KRAPIVA_DEV_API_BASE_URL: http://127.0.0.1:53000/
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify APK and record source
        run: |
          mkdir -p p10-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk p10-artifact/KraPiva-P10-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify p10-artifact/KraPiva-P10-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 p10-artifact/KraPiva-P10-debug.apk
          (cd p10-artifact && sha256sum KraPiva-P10-debug.apk > SHA256SUMS.txt)
          git rev-parse HEAD > p10-artifact/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KraPiva-P10-debug
          path: p10-artifact/
          if-no-files-found: error
          retention-days: 7
