<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка графики P10</title>
<style>
  :root { font: 16px system-ui, sans-serif; color-scheme: light dark; }
  body { max-width: 70rem; margin: auto; padding: 1rem; }
  h1 { font-size: 1.5rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .65rem 1.25rem; align-items: center; margin-block: 1rem; }
  label { display: inline-flex; align-items: center; gap: .5rem; }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: .75rem; }
  figure { margin: 0; border: 1px solid #8887; border-radius: .65rem; overflow: hidden; }
  figcaption { padding: .65rem .8rem; font-weight: 550; }
  canvas { display: block; width: 100%; height: auto; }
  .light { background: #f6f4ed; color: #202321; }
  .dark { background: #202321; color: #f6f4ed; }
  select, button { font: inherit; }
</style>
<h1>Проверка графики P10</h1>
<div class="controls">
  <label>Питомец <select id="pet" disabled></select></label>
  <label>Движение <select id="clip" disabled><option value="">Покой</option></select></label>
  <button id="play" type="button" disabled>Проиграть</button>
  <label>Кадр <input id="time" type="range" min="0" max="0" value="0" disabled></label>
  <label><input id="anchors" type="checkbox"> Точки крепления</label>
</div>
<p id="status" role="status">Загружаем ресурсы…</p>
<div class="boards">
  <figure class="light"><canvas width="630" height="630" aria-label="Питомец на светлом фоне"></canvas><figcaption>Светлая тема</figcaption></figure>
  <figure class="dark"><canvas width="630" height="630" aria-label="Питомец на тёмном фоне"></canvas><figcaption>Тёмная тема</figcaption></figure>
</div>
<script type="module" src="./preview.mjs"></script>
</html>
